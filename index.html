<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistoria Interna de Obra</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%23004a8f'/><path d='M256 110L120 220h30l106-85 106 85h30z' fill='%23fff'/><rect x='180' y='210' width='152' height='180' rx='16' fill='%23fff'/><rect x='216' y='195' width='80' height='30' rx='8' fill='%23e6ebf5'/><rect x='236' y='185' width='40' height='20' rx='6' fill='%23004a8f'/><rect x='205' y='245' width='102' height='12' rx='4' fill='%23c8d2e1'/><rect x='205' y='270' width='102' height='12' rx='4' fill='%23c8d2e1'/><path d='M210 335l35 35 80-80 20 20-100 100-55-55z' fill='%2328a745'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%23004a8f'/><path d='M256 110L120 220h30l106-85 106 85h30z' fill='%23fff'/><rect x='180' y='210' width='152' height='180' rx='16' fill='%23fff'/><rect x='216' y='195' width='80' height='30' rx='8' fill='%23e6ebf5'/><rect x='236' y='185' width='40' height='20' rx='6' fill='%23004a8f'/><rect x='205' y='245' width='102' height='12' rx='4' fill='%23c8d2e1'/><rect x='205' y='270' width='102' height='12' rx='4' fill='%23c8d2e1'/><path d='M210 335l35 35 80-80 20 20-100 100-55-55z' fill='%2328a745'/></svg>">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#004a8f">

    <style>
        :root { --primary: #004a8f; --bg: #f4f6f9; --border: #ccc; --success: #28a745; --danger: #dc3545; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg); padding: 12px; color: #333; }
        .container { max-width: 680px; margin: 0 auto; }
        
        header { background: var(--primary); color: #fff; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
        .card { background: #fff; border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .grid-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        
        .btn { padding: 10px; background: #eee; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; text-align: center; font-weight: bold; font-size: 0.9rem; }
        .btn.active { background: var(--primary); color: #fff; }
        
        .btn-opt { padding: 12px; background: #eef4fa; border: 2px solid #b8daff; border-radius: 6px; cursor: pointer; text-align: center; font-weight: bold; font-size: 0.9rem; color: var(--primary); }
        .btn-opt.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        
        .item-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .item-header { display: flex; justify-content: space-between; align-items: center; }
        .item-title { font-weight: bold; font-size: 0.95rem; color: #333; }
        
        .btn-status { padding: 6px 12px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-ok-active { background: var(--success); color: white; }
        .btn-nok-active { background: var(--danger); color: white; }
        .btn-neutral { background: #e0e0e0; color: #333; }

        .nc-box { background: #fff5f5; border: 1px solid #f5c6cb; border-left: 5px solid var(--danger); border-radius: 6px; padding: 12px; margin-top: 10px; position: relative; }
        .nc-header { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: bold; color: var(--danger); margin-bottom: 8px; }
        .btn-remove { background: #ff4d4d; color: white; border: none; border-radius: 3px; padding: 2px 6px; font-size: 0.75rem; cursor: pointer; }

        .checklist-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #eee; }
        .chk-label { font-size: 0.8rem; font-weight: normal; display: flex; align-items: center; gap: 6px; margin: 0; cursor: pointer; color: #333; }

        label { font-size: 0.8rem; font-weight: bold; display: block; margin-top: 8px; color: #444; }
        input, select { width: 100%; padding: 8px; margin-top: 2px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.85rem; }
        
        .btn-add-nc { background: #007bff; color: white; border: none; padding: 10px 12px; border-radius: 5px; font-weight: bold; font-size: 0.85rem; margin-top: 10px; cursor: pointer; display: none; width: 100%; }
        .btn-export { width: 100%; padding: 15px; background: #17a2b8; color: #fff; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        .btn-next-unit { width: 100%; padding: 14px; background: #28a745; color: #fff; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; display: none; }

        .accordion { width: 100%; padding: 12px; background: #eef4fa; border: 1px solid #b8daff; border-radius: 6px; font-weight: bold; color: var(--primary); text-align: left; margin-top: 10px; cursor: pointer; }
        .content { display: none; padding-top: 10px; }
        
        .badge { display: inline-block; background: #ffc107; color: #000; padding: 3px 8px; border-radius: 4px; font-size: 0.78rem; font-weight: bold; margin-left: 5px; }

        /* Canvas de Assinatura */
        .signature-box { border: 2px dashed #a0aec0; border-radius: 6px; background: #fafafa; margin-top: 6px; position: relative; touch-action: none; }
        canvas { width: 100%; height: 120px; display: block; cursor: crosshair; }
        .btn-clear-sig { position: absolute; right: 8px; bottom: 8px; background: #6c757d; color: white; border: none; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
        .btn-confirm-inspector { background: var(--success); color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; margin-top: 12px; cursor: pointer; }

        /* ESTILOS DE IMPRESSÃO / SALVAR EM PDF NATIVO */
        @media print {
            body { background: #fff !important; padding: 0 !important; }
            .no-print, #app-content { display: none !important; }
            #print-report { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
        }

        #print-report { display: none; background: #fff; padding: 10px; font-family: Arial, sans-serif; color: #333; }
        .pdf-header-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; border: 1px solid #004a8f; }
        .pdf-header-table td { padding: 6px 10px; border: 1px solid #cccccc; font-size: 12px; }
        .pdf-header-title { background: #004a8f; color: #ffffff; font-weight: bold; text-align: center; font-size: 15px; padding: 8px !important; }
        .pdf-section-title { background: #f0f4f8; color: #004a8f; padding: 6px 8px; font-size: 13px; font-weight: bold; border-left: 4px solid #004a8f; margin: 12px 0 8px 0; }
        .pdf-nc-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 11px; }
        .pdf-nc-table th { background: #eef4fa; color: #333333; padding: 6px; border: 1px solid #cccccc; text-align: left; font-weight: bold; }
        .pdf-nc-table td { padding: 6px; border: 1px solid #cccccc; vertical-align: top; line-height: 1.3; }
        .pdf-signatures { margin-top: 30px; width: 300px; margin-left: auto; margin-right: auto; text-align: center; border-top: 1px solid #000000; padding-top: 5px; font-size: 11px; }
    </style>
</head>
<body>

<div class="container" id="app-content">
    <header class="no-print">
        <h2>Vistoria Interna de Obra</h2>
        <p style="font-size:0.8rem;">Controle Técnico de Qualidade & Pendências</p>
    </header>

    <!-- 0. Identificação do Vistoriador -->
    <div class="card no-print" id="inspector-card">
        <h3>👤 Identificação do Responsável Técnico</h3>
        <label>Nome Completo do Engenheiro / Vistoriador:</label>
        <input type="text" id="inspector-name" placeholder="Ex: Eng. Bruno Lamenha">

        <label>Assinatura Digital (Desenhe abaixo):</label>
        <div class="signature-box">
            <canvas id="sig-canvas"></canvas>
            <button class="btn-clear-sig" onclick="clearSignature()">Limpar ↺</button>
        </div>

        <button class="btn-confirm-inspector" onclick="confirmInspector()">Confirmar Responsável ✓</button>
    </div>

    <!-- 1. Seleção de Pavimento -->
    <div class="card no-print" id="floor-card" style="display:none;">
        <h3>1. Selecione o Pavimento</h3>
        <div class="grid" id="floors">
            <div class="btn" onclick="setFloor(1, this)">1º Pav</div>
            <div class="btn" onclick="setFloor(2, this)">2º Pav</div>
            <div class="btn" onclick="setFloor(3, this)">3º Pav</div>
            <div class="btn" onclick="setFloor(4, this)">4º Pav</div>
        </div>
    </div>

    <!-- 2. Seleção de Unidade -->
    <div class="card no-print" id="unit-card" style="display:none;">
        <h3>2. Selecione a Unidade</h3>
        <div class="grid" id="units"></div>
    </div>

    <!-- 3. Tipo e Etapa (Vistoria vs Revistoria) -->
    <div class="card no-print" id="type-card" style="display:none;">
        <h3>3. Configuração do Acompanhamento</h3>
        
        <label>Tipo de Vistoria:</label>
        <div class="grid-two">
            <div class="btn-opt" onclick="setCategory('Padrão (Construtora)', this)">🏗️ Padrão</div>
            <div class="btn-opt" onclick="setCategory('Reforma', this)">🔨 Reforma</div>
        </div>

        <label style="margin-top:12px;">Etapa / Ciclo de Inspeção:</label>
        <div class="grid-two">
            <div class="btn-opt" onclick="setStage('1ª Vistoria', this)">📋 1ª Vistoria</div>
            <div class="btn-opt" onclick="setStage('Revistoria', this)">🔄 Revistoria</div>
        </div>
    </div>

    <!-- Área de Inspeção -->
    <div id="inspection-area" class="no-print" style="display:none;">
        <div class="card" style="background: var(--primary); color: white;">
            <h3 id="unit-title">Unidade: ---</h3>
        </div>

        <div class="card">
            <button class="accordion" onclick="toggle('room-dorm')">Dormitório / Cozinha</button>
            <div class="content" id="room-dorm"></div>
        </div>

        <div class="card">
            <button class="accordion" onclick="toggle('room-bath')">Banheiro</button>
            <div class="content" id="room-bath"></div>
        </div>

        <div class="card">
            <button class="accordion" onclick="toggle('room-balcony')">Varanda</button>
            <div class="content" id="room-balcony"></div>
        </div>

        <button class="btn-export" onclick="generateTechnicalPDF()">📄 Finalizar & Salvar Relatório Interno (PDF)</button>
        <button class="btn-next-unit" id="btn-next" onclick="startNextUnit()">➡️ Próxima Unidade</button>
    </div>
</div>

<!-- CONTAINER DE IMPRESSÃO PDF -->
<div id="print-report"></div>

<script>
    const roomNames = {
        'room-dorm': 'Dormitório / Cozinha',
        'room-bath': 'Banheiro',
        'room-balcony': 'Varanda'
    };

    const checklist = [
        { id: "bancada", name: "1. Bancadas, Soleiras e Peitoris", options: ["Peça Trincada / Bicada", "Falta de Rejunte / Silicone", "Falta Rodamão / Espelho", "Desnível / Fora de Prumo", "Mancha no Granito", "Outros"] },
        { id: "piso", name: "2. Contrapiso e Revestimentos / Rodapés", options: ["Peça Oca / Solta", "Junta Desalinhada", "Caimento Incorreto (Poça)", "Rodapé Solto / Danificado", "Falta Rejunte no Piso", "Piso Riscado / Manchado", "Outros"] },
        { id: "pintura", name: "3. Pintura e Emassamento", options: ["Falta Emassamento", "Falta Lixamento / Imperfeição", "Falta 1ª Demão", "Falta 2ª Demão / Pintura Final", "Mancha / Desbotamento", "Recorte Mal Feito", "Fissura / Trinca", "Sujeira / Tinta Escorrida", "Outros"] },
        { id: "hidra", name: "4. Metais, Louças e Sifão", options: ["Vazamento / Gotejamento", "Sifão Sem Vedação", "Peça Arranhada / Amassada", "Falta Acabamento de Registro", "Vaso Sanitário Solto", "Descarga Sem Funcionamento", "Outros"] },
        { id: "portas", name: "5. Portas de Madeira e Alizares", options: ["Porta Raspando no Piso/Marco", "Fechadura / Maçaneta Ruim", "Alizar Descolando / Fora de Prumo", "Falta Pintura / Verniz", "Porta Empenada", "Outros"] },
        { id: "esquadria", name: "6. Esquadrias de Alumínio, Vidros e Vedações", options: ["Vidro Riscado / Trincado", "Falta Vedação de Silicone", "Trilho / Roldana Travando", "Fecho / Trava Danificada", "Guarda-Corpo Desancorado", "Outros"] },
        { id: "eletrica", name: "7. Tomadas, Interruptores e Plafons", options: ["Espelho Torto / Descaixado", "Sem Espelho / Módulo", "Ponto Sem Energia / Fio Solto", "Plafon Não Liga / Danificado", "Quadro de Disjuntores Incompleto", "Outros"] },
        { id: "ac", name: "8. Infraestrutura / Aparelho Ar-Condicionado", options: ["Dreno Entupido / Sem Vazão", "Falta Ponto Elétrico", "Carga Sem Pressão", "Tubulação Exposta", "Outros"], hasAC: true }
    ];

    let ncCounters = {};
    let selectedFloorNum = null;
    let selectedUnitNum = null;
    let selectedCategory = "";
    let selectedStage = "";
    let inspectorName = "";
    let inspectorSigData = null;
    let revisionCount = 1;

    let canvas, ctx, isDrawing = false;

    window.onload = () => {
        canvas = document.getElementById('sig-canvas');
        ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = 120;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);
    };

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        if (e.touches && e.touches[0]) {
            return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
        }
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function startDrawing(e) {
        e.preventDefault();
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }

    function stopDrawing() {
        if (isDrawing) {
            isDrawing = false;
            inspectorSigData = canvas.toDataURL('image/png');
        }
    }

    function clearSignature() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        inspectorSigData = null;
    }

    function confirmInspector() {
        const nameInput = document.getElementById('inspector-name').value.trim();
        if (!nameInput) { alert('Por favor, informe o nome do vistoriador.'); return; }
        if (!inspectorSigData) { alert('Por favor, faça a assinatura na tela.'); return; }

        inspectorName = nameInput;
        document.getElementById('inspector-card').style.background = '#eef6ff';
        document.getElementById('inspector-card').innerHTML = `
            <h3>👤 Responsável Confirmado</h3>
            <p style="font-size:0.9rem; margin-top:5px;"><strong>Engenheiro/Vistoriador:</strong> ${inspectorName}</p>
            <p style="font-size:0.8rem; color:green; font-weight:bold; margin-top:3px;">✓ Assinatura Registrada</p>
        `;
        document.getElementById('floor-card').style.display = 'block';
    }

    function setFloor(f, el) {
        selectedFloorNum = f;
        document.querySelectorAll('#floors .btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        const u = document.getElementById('units');
        u.innerHTML = '';
        for (let i = 1; i <= 19; i++) {
            let num = (f * 100) + i;
            u.innerHTML += `<div class="btn" onclick="selectUnit(${num}, this)">${num}</div>`;
        }
        document.getElementById('unit-card').style.display = 'block';
        document.getElementById('type-card').style.display = 'none';
        document.getElementById('inspection-area').style.display = 'none';
    }

    function selectUnit(u, el) {
        selectedUnitNum = u;
        document.querySelectorAll('#units .btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('type-card').style.display = 'block';
        document.getElementById('inspection-area').style.display = 'none';
        
        selectedCategory = "";
        selectedStage = "";
        document.querySelectorAll('#type-card .btn-opt').forEach(b => b.classList.remove('active'));
    }

    function setCategory(cat, el) {
        selectedCategory = cat;
        el.parentElement.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        checkAndShowInspection();
    }

    function setStage(stage, el) {
        selectedStage = stage;
        el.parentElement.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        checkAndShowInspection();
    }

    function checkAndShowInspection() {
        if (selectedCategory && selectedStage) {
            // Verifica histórico da unidade no localStorage
            const historyKey = `history_unit_${selectedUnitNum}`;
            const existingHistory = JSON.parse(localStorage.getItem(historyKey) || "[]");
            
            if (selectedStage === 'Revistoria') {
                revisionCount = existingHistory.length + 1;
                selectedStage = `${revisionCount}ª Revistoria`;
            } else {
                revisionCount = 1;
            }

            document.getElementById('unit-title').innerHTML = `Unidade ${selectedUnitNum} <span class="badge">${selectedCategory}</span> <span class="badge" style="background:#17a2b8; color:#fff;">${selectedStage}</span>`;
            document.getElementById('inspection-area').style.display = 'block';
            
            render('room-dorm', true, existingHistory);
            render('room-bath', false, existingHistory);
            render('room-balcony', true, existingHistory);
        }
    }

    function render(cId, allowAC, history) {
        const c = document.getElementById(cId);
        c.innerHTML = '';
        checklist.forEach(item => {
            if (!allowAC && item.hasAC) return;
            const fullId = `${cId}_${item.id}`;
            ncCounters[fullId] = 0;

            // Busca se havia não conformidade registrada anteriormente para este item
            let prevPending = null;
            if (history && history.length > 0) {
                const lastInsp = history[history.length - 1];
                if (lastInsp.pendencies) {
                    prevPending = lastInsp.pendencies.find(p => p.fullId === fullId);
                }
            }

            c.innerHTML += `
                <div class="item-card" id="${fullId}">
                    <div class="item-header">
                        <span class="item-title">${item.name}</span>
                        <div>
                            <button class="btn-status btn-neutral" id="btn-ok-${fullId}" onclick="setStatus('${fullId}', true)">✓ OK</button>
                            <button class="btn-status btn-neutral" id="btn-nok-${fullId}" onclick="setStatus('${fullId}', false)">✗ Pendente</button>
                        </div>
                    </div>
                    ${prevPending ? `
                        <div style="background:#fff3cd; border:1px solid #ffeeba; padding:6px 10px; border-radius:4px; margin-top:8px; font-size:0.78rem; color:#856404;">
                            ⚠️ <strong>Ponto Anterioremente Pendente:</strong> ${prevPending.details.join(', ')} (Prazo anterior: ${prevPending.days} dias)
                        </div>
                    ` : ''}
                    <div class="nc-list" id="nc-list-${fullId}"></div>
                    <button class="btn-add-nc" id="btn-add-${fullId}" onclick="addNC('${fullId}', '${item.id}')">+ Adicionar Ponto / Não Conformidade</button>
                </div>
            `;

            // Se era pendente anteriormente na revistoria, já inicializa em estado de checagem
            if (prevPending && selectedStage.includes('Revistoria')) {
                setTimeout(() => setStatus(fullId, false), 50);
            }
        });
    }

    function setStatus(fullId, isOk) {
        const btnOk = document.getElementById(`btn-ok-${fullId}`);
        const btnNok = document.getElementById(`btn-nok-${fullId}`);
        const btnAdd = document.getElementById(`btn-add-${fullId}`);
        const ncList = document.getElementById(`nc-list-${fullId}`);

        if (isOk) {
            btnOk.className = "btn-status btn-ok-active";
            btnNok.className = "btn-status btn-neutral";
            btnAdd.style.display = 'none';
            ncList.innerHTML = '';
            ncCounters[fullId] = 0;
        } else {
            btnNok.className = "btn-status btn-nok-active";
            btnOk.className = "btn-status btn-neutral";
            btnAdd.style.display = 'block';
            if (ncCounters[fullId] === 0) {
                const baseItemId = fullId.split('_')[1];
                addNC(fullId, baseItemId);
            }
        }
    }

    function addNC(fullId, itemId) {
        ncCounters[fullId]++;
        const count = ncCounters[fullId];
        const ncList = document.getElementById(`nc-list-${fullId}`);
        const ncBoxId = `nc-${fullId}-${count}`;

        const itemObj = checklist.find(i => i.id === itemId) || { options: ["Falha de Acabamento", "Outros"] };

        let checkboxesHTML = itemObj.options.map((opt) => `
            <label class="chk-label">
                <input type="checkbox" value="${opt}" onchange="toggleOtherField('${ncBoxId}', this, '${opt}')"> ${opt}
            </label>
        `).join('');

        const div = document.createElement('div');
        div.className = 'nc-box';
        div.id = ncBoxId;
        div.setAttribute('data-item-id', itemId);
        div.setAttribute('data-full-id', fullId);
        div.innerHTML = `
            <div class="nc-header">
                <span>PONTO / PENDÊNCIA #${count}</span>
                <button class="btn-remove" onclick="removeNC('${ncBoxId}')">Remover ✕</button>
            </div>
            
            <label>Selecione as não conformidades identificadas:</label>
            <div class="checklist-group">
                ${checkboxesHTML}
            </div>

            <div id="other-field-${ncBoxId}" style="display:none;">
                <label style="color:var(--danger);">Descreva a opção "Outros" / Observação Exata:</label>
                <input type="text" class="nc-other-input" placeholder="Ex: Trinca perto da tomada no lado direito">
            </div>

            <label>Responsável Pela Correção:</label>
            <select class="nc-resp">
                <option>Pintura / Emassamento</option>
                <option>Marmoraria / Graniteiro</option>
                <option>Instalações Hidráulicas</option>
                <option>Eletricista</option>
                <option>Marcenaria / Portas de Madeira</option>
                <option>Esquadrias de Alumínio / Vidros</option>
                <option>Piso e Revestimento</option>
                <option>Gesso / Sancas</option>
            </select>
            
            <label>Novo Prazo de Conclusão (Dias Úteis):</label>
            <input type="number" placeholder="Ex: 3" class="nc-days">
        `;
        ncList.appendChild(div);
    }

    function toggleOtherField(boxId, checkbox, optName) {
        if (optName === 'Outros') {
            const otherDiv = document.getElementById(`other-field-${boxId}`);
            otherDiv.style.display = checkbox.checked ? 'block' : 'none';
        }
    }

    function removeNC(boxId) {
        const box = document.getElementById(boxId);
        if (box) box.remove();
    }

    function toggle(id) {
        const el = document.getElementById(id);
        el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    // GERA O RELATÓRIO PDF NATIVO INTERNO
    function generateTechnicalPDF() {
        const today = new Date().toLocaleDateString('pt-BR');
        const printContainer = document.getElementById('print-report');
        
        let pendingCount = 0;
        let rowsHTML = '';
        let currentPendencies = [];

        ['room-dorm', 'room-bath', 'room-balcony'].forEach(roomId => {
            const roomName = roomNames[roomId];
            const roomEl = document.getElementById(roomId);
            if (!roomEl) return;

            const ncBoxes = roomEl.querySelectorAll('.nc-box');
            ncBoxes.forEach(box => {
                pendingCount++;
                const itemId = box.getAttribute('data-item-id');
                const fullId = box.getAttribute('data-full-id');
                const itemObj = checklist.find(i => i.id === itemId) || { name: 'Item de Vistoria' };
                
                let selectedOpts = [];
                box.querySelectorAll('.checklist-group input[type="checkbox"]:checked').forEach(chk => {
                    selectedOpts.push(chk.value);
                });

                const otherVal = box.querySelector('.nc-other-input')?.value;
                if (otherVal) selectedOpts.push(`Outros: ${otherVal}`);

                const respVal = box.querySelector('.nc-resp')?.value || 'Não informado';
                const daysVal = box.querySelector('.nc-days')?.value || '-';

                currentPendencies.push({
                    fullId: fullId,
                    room: roomName,
                    item: itemObj.name,
                    details: selectedOpts,
                    resp: respVal,
                    days: daysVal
                });

                rowsHTML += `
                    <tr>
                        <td style="font-weight:bold;">${roomName}</td>
                        <td>${itemObj.name}</td>
                        <td>${selectedOpts.length > 0 ? selectedOpts.map(o => `• ${o}`).join('<br>') : 'Pendência apontada sem detalhes'}</td>
                        <td>${respVal}</td>
                        <td style="text-align:center;">${daysVal} dias</td>
                    </tr>
                `;
            });
        });

        // Salva histórico no localStorage para revistorias futuras
        const historyKey = `history_unit_${selectedUnitNum}`;
        const existingHistory = JSON.parse(localStorage.getItem(historyKey) || "[]");
        existingHistory.push({
            date: today,
            stage: selectedStage,
            category: selectedCategory,
            inspector: inspectorName,
            pendenciesCount: pendingCount,
            pendencies: currentPendencies
        });
        localStorage.setItem(historyKey, JSON.stringify(existingHistory));

        const statusGeneral = pendingCount > 0 ? `<span style="color:#dc3545; font-weight:bold;">REPROVADO (${pendingCount} pendências)</span>` : `<span style="color:#28a745; font-weight:bold;">APROVADO (Sem pendências)</span>`;

        printContainer.innerHTML = `
            <table class="pdf-header-table">
                <tr>
                    <td colspan="4" class="pdf-header-title">RELATÓRIO TÉCNICO INTERNO DE VISTORIA</td>
                </tr>
                <tr>
                    <td><strong>Data da Vistoria:</strong> ${today}</td>
                    <td><strong>Pavimento:</strong> ${selectedFloorNum}º Pav</td>
                    <td><strong>Unidade:</strong> ${selectedUnitNum}</td>
                    <td><strong>Etapa/Ciclo:</strong> ${selectedCategory} (${selectedStage})</td>
                </tr>
                <tr>
                    <td colspan="2"><strong>Responsável Técnico:</strong> ${inspectorName}</td>
                    <td colspan="2"><strong>Status Técnico:</strong> ${statusGeneral}</td>
                </tr>
            </table>

            <div class="pdf-section-title">DETALHAMENTO DAS NÃO CONFORMIDADES / PENDÊNCIAS DA OBRA</div>

            ${pendingCount > 0 ? `
                <table class="pdf-nc-table">
                    <thead>
                        <tr>
                            <th style="width:20%;">Ambiente</th>
                            <th style="width:25%;">Item / Serviço</th>
                            <th style="width:35%;">Não Conformidade Identificada</th>
                            <th style="width:12%;">Responsável</th>
                            <th style="width:8%;">Prazo</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rowsHTML}
                    </tbody>
                </table>
            ` : `
                <div style="padding: 15px; text-align:center; border:1px solid #cccccc; background:#f9f9f9; color:#28a745; font-weight:bold; margin-bottom:20px;">
                    ✓ Nenhum ponto de pendência foi identificado nesta vistoria. Unidade Liberada.
                </div>
            `}

            <div class="pdf-signatures">
                ${inspectorSigData ? `<img src="${inspectorSigData}" style="max-height:45px; display:block; margin:0 auto 5px auto;">` : ''}
                <strong>${inspectorName}</strong><br>
                Responsável Técnico / Engenharia de Obra
            </div>
        `;

        document.getElementById('btn-next').style.display = 'block';
        window.print();
    }

    function startNextUnit() {
        document.getElementById('inspection-area').style.display = 'none';
        document.getElementById('type-card').style.display = 'none';
        document.getElementById('unit-card').style.display = 'none';
        document.getElementById('btn-next').style.display = 'none';

        document.querySelectorAll('#floors .btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('#units .btn').forEach(b => b.classList.remove('active'));
        
        selectedUnitNum = null;
        selectedCategory = "";
        selectedStage = "";

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
